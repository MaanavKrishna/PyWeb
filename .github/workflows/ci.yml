name: CI

on:
  push:
    branches: ["main", "v1/*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyWeb + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run test suite
        run: python -m pytest tests/ -q -p no:cacheprovider
      - name: Build reference examples
        run: |
          for app in counter todo blog auth chat showcase; do
            python -m pyweb.cli build examples/$app/app.pyweb --out /tmp/dist-$app --production
          done
      - name: Enforce shipped-JS budgets
        run: |
          # Budget what ships: minified runtime bundle in a production build,
          # not the readable dev source.
          rt=$(ls /tmp/dist-counter/static/runtime.*.js)
          size=$(wc -c < "$rt")
          echo "shipped runtime: $size bytes (budget 12288)"
          test "$size" -lt 12288
          total=$(cat /tmp/dist-counter/static/*.js | wc -c)
          echo "counter total JS: $total bytes (budget 16384)"
          test "$total" -lt 16384
      - name: Security gate
        run: |
          for app in counter todo blog auth chat showcase; do
            python -m pyweb.cli check examples/$app/app.pyweb
          done
