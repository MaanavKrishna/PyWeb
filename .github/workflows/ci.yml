name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pyweb tests website

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]" pip-audit
      # Known vulnerabilities in anything PyWeb installs (the package itself is skipped as editable).
      - run: pip-audit --skip-editable --progress-spinner off

  test:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]   # 3.15t: free-threaded (no GIL)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[test,crypto]"
      - name: Unit tests (node runs the JS runtime/translator differential tests)
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/e2e --ignore=tests/integration
        env:
          # On one version, every page render is also interpreted and must match the compiled HTML.
          PYWEB_SSR_VERIFY: ${{ matrix.python == '3.12' && '1' || '' }}

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ../..
      - run: npm ci
      - run: npm test
      # The extension in a real VS Code (the oldest it supports and the current stable one),
      # talking to the real language server: activation, errors, hover, completion, outline, lenses.
      - run: xvfb-run -a npm run test:integration
        env:
          PYWEB_PYTHON: python
      - run: npx vsce package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyweb-vscode
          path: editors/vscode/*.vsix

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Loose limits: catches order-of-magnitude regressions, not noise.
      - run: python -m pyweb.bench --max-ssr-ms 2 --max-compile-ms 50
      # Whole system (requests/s over sockets, a signed-in page, start-up, live queries), against the
      # commit before on this same runner, alternating 5 runs each: fails if 15% slower.
      - name: compare with the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD^); fi
          git worktree add ../base "$BASE"
          python -m pyweb.bench --compare ../base --rounds 5

  browser:
    name: browser (Playwright + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m playwright install --with-deps chromium
      - name: Pyodide for the playground tests
        run: |
          v=$(python -c "import re; print(re.search(r'PYODIDE_VERSION = \"(.+?)\"', open('website/build.py').read()).group(1))")
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm pack "pyodide@$v" --silent && tar xzf pyodide-*.tgz
          # The npm build has only the core; SQLite (apps with a database) comes from the full distribution.
          wheel=$(python -c "import json; print(json.load(open('package/pyodide-lock.json'))['packages']['sqlite3']['file_name'])")
          curl -sSfL -o "package/$wheel" "https://cdn.jsdelivr.net/pyodide/v$v/full/$wheel"
          echo "PYWEB_PYODIDE_DIR=$RUNNER_TEMP/pyodide/package" >> "$GITHUB_ENV"
      - run: python -m pytest tests/e2e -q -p no:cacheprovider
        env:
          PYWEB_SSR_VERIFY: "1"   # browser tests also check compiled rendering against the interpreter

  integration:
    name: integration (Postgres, MySQL, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyweb
          POSTGRES_PASSWORD: pyweb
          POSTGRES_DB: pyweb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyweb" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pyweb
          MYSQL_DATABASE: pyweb_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppyweb" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYWEB_TEST_POSTGRES: postgresql://pyweb:pyweb@127.0.0.1:5432/pyweb_test
      PYWEB_TEST_MYSQL: mysql://root:pyweb@127.0.0.1:3306/pyweb_test
      PYWEB_TEST_REDIS: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[all,test]" openapi-spec-validator
      # Everything but the browser tests, with the services: the job-store contract,
      # Redis-backed sessions/rate limits/throttles and the integration suites all run here.
      - run: python -m pytest tests -q -p no:cacheprovider -rs --ignore=tests/e2e

  zap:
    name: OWASP ZAP baseline scan (saas example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build and serve the saas example as in production
        working-directory: examples/saas
        run: |
          python -m pyweb.cli build app.pyweb --out dist
          PYWEB_WORKER=0 PYWEB_AUTH_SECRET=$(python -c "import secrets; print(secrets.token_hex(32))") \
            nohup python -m pyweb.cli serve dist --port 8799 > serve.log 2>&1 &
          for i in $(seq 50); do curl -fs http://127.0.0.1:8799/healthz && break; sleep 0.2; done
      # Passive scan: headers, cookies, CSP, information leaks. .github/zap/rules.tsv lists the
      # checks that fail the job; any high-risk alert fails it too.
      - name: Scan
        run: |
          mkdir -p zap && chmod 777 zap && cp .github/zap/rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            zaproxy/zap-stable@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t http://127.0.0.1:8799 -m 2 -c rules.tsv -J report.json -I
          python .github/zap/check.py zap/report.json
      - if: failure()
        run: cat examples/saas/serve.log

  deploy:
    name: deploy (compose, 2 replicas + worker + Postgres + Redis + Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e . && pip wheel . --no-deps -w tests/deploy
      - name: Plan and write the files
        working-directory: tests/deploy
        run: python -m pyweb.cli deploy compose --replicas 2 --out . --check
      - name: Start the stack
        working-directory: tests/deploy
        run: |
          printf "PYWEB_AUTH_SECRET=%s\nDB_PASSWORD=%s\n" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .env
          docker compose build --build-arg PYWEB_SPEC=./$(ls pyweb_stack-*.whl)
          docker compose up -d --wait --wait-timeout 180
      - run: python tests/deploy/smoke.py
      - name: Logs on failure
        if: failure()
        working-directory: tests/deploy
        run: docker compose ps && docker compose logs --tail 80

  desktop:
    name: desktop app (real window, packaged with Briefcase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: System libraries (a display, Qt WebEngine's, and GTK/WebKit for the packaged app)
        env:
          DEBIAN_FRONTEND: noninteractive     # no prompts (debconf, needrestart)
          NEEDRESTART_MODE: a
        run: |
          sudo rm -f /var/lib/man-db/auto-update   # the man page index rebuild takes minutes
          sudo apt-get update -q
          sudo -E apt-get install -y -q xvfb xauth libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libcairo2-dev libgirepository1.0-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libcanberra-gtk3-module python3-dev python3-venv build-essential
      - name: Install
        run: |
          pip install -e ".[test,desktop]" "pywebview[qt6]"
          # Linux system packages are built with the OS's own Python, so Briefcase runs on it.
          /usr/bin/python3 -m venv /tmp/briefcase && /tmp/briefcase/bin/pip install -q briefcase
      - name: The app in a real window (Qt WebEngine)
        run: xvfb-run -a python -m pytest tests/desktop tests/test_desktop.py -q -p no:cacheprovider
        env:
          PYWEB_TEST_GUI: qt
      - name: Package the todo example (Linux system package) and open the built app
        run: |
          python -m pyweb.cli build examples/todo/app.pyweb --desktop --out /tmp/todo-desktop \
            --pyweb "pyweb-stack[desktop] @ file://$GITHUB_WORKSPACE"
          cd /tmp/todo-desktop
          /tmp/briefcase/bin/briefcase create linux system --no-input
          /tmp/briefcase/bin/briefcase build linux system --no-input
          /tmp/briefcase/bin/briefcase package linux system --no-input
          ls -la dist
          app=$(find build -path '*usr/bin/*' -type f | head -1)
          PYWEB_DESKTOP_SMOKE=1 PYWEB_DESKTOP_DATA=/tmp/todo-data xvfb-run -a "$app" | tee /tmp/smoke.txt
          grep -q "pyweb desktop smoke: ok Todos" /tmp/smoke.txt
  examples:
    name: examples, budgets, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e . build
      - name: Check and build every example
        run: |
          for app in counter todo blog auth chat showcase; do
            python -m pyweb.cli check examples/$app/app.pyweb
            python -m pyweb.cli build examples/$app/app.pyweb --out /tmp/dist-$app --production
          done
      - name: Enforce shipped-JS budgets (gzip)
        run: |
          python - <<'PY'
          import json
          m = json.load(open("/tmp/dist-counter/manifest.json"))
          rt, page = m["runtime_gzip_bytes"], m["pages"]["Home"]["gzip_bytes"]
          print(f"runtime {rt} B gzip (budget 15360), counter page {page} B gzip (budget 2048)")
          assert rt < 15360 and page < 2048
          PY
      - name: Build sdist + wheel and smoke-test the wheel
        run: |
          python -m build
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/pyweb new smoke && cd smoke
          /tmp/wheel-env/bin/pyweb build app.pyweb --out dist --production
          /tmp/wheel-env/bin/python -c "from pyweb.testing import TestClient; c = TestClient('app.pyweb'); assert c.get('/').status == 200"
