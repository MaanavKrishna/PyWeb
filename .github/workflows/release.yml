name: Release

# To publish: on GitHub open Releases -> "Draft a new release", create a
# tag like v0.1.0 on main, and click "Publish release". This workflow then
# builds the package, uploads it to PyPI and attaches the files to the
# release.
#
# PyPI publishing uses Trusted Publishing: on pypi.org add a (pending)
# trusted publisher for the `pyweb-stack` project with owner MaanavKrishna,
# repository PyWeb, workflow release.yml and environment pypi. No API
# token is needed.

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach files and changelog notes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
