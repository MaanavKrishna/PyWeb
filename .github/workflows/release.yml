name: Release

# To publish: on GitHub open Releases -> "Draft a new release", create a
# tag like v0.1.0 on main, and click "Publish release". This workflow then
# builds the package, uploads it to PyPI and attaches the files to the
# release.
#
# PyPI publishing uses Trusted Publishing: on pypi.org add a (pending)
# trusted publisher for the `pyweb-stack` project with owner MaanavKrishna,
# repository PyWeb, workflow release.yml and environment pypi. No API
# token is needed.
#
# The VS Code extension (editors/vscode) is built and attached to the
# release as a .vsix. It is also published to the VS Code Marketplace
# and Open VSX when the repository has VSCE_PAT / OVSX_PAT secrets.

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - run: pip install build && python -m build
      # Signed build provenance: anyone can check the files came from this workflow
      # (gh attestation verify <file> --repo MaanavKrishna/PyWeb).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach files and changelog notes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  vscode:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extension version matches the release
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "editors/vscode version $v != ${GITHUB_REF_NAME}"; exit 1; }
      - run: npm ci && npm test && npx vsce package
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: editors/vscode/*.vsix
      - name: Attach the .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" *.vsix --clobber
      - name: Publish to the VS Code Marketplace (if VSCE_PAT is set)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: if [ -n "$VSCE_PAT" ]; then npx vsce publish --packagePath *.vsix; else echo "no VSCE_PAT; skipped"; fi
      - name: Publish to Open VSX (if OVSX_PAT is set)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish *.vsix -p "$OVSX_PAT"; else echo "no OVSX_PAT; skipped"; fi
