name: Release

# To publish: on GitHub open Releases -> "Draft a new release", create a
# tag like v0.1.0 on main, and click "Publish release". This workflow then
# builds the package, uploads it to PyPI and attaches the files to the
# release.
#
# PyPI publishing uses Trusted Publishing: on pypi.org add a (pending)
# trusted publisher for the `pyweb-stack` project with owner MaanavKrishna,
# repository PyWeb, workflow release.yml and environment pypi. No API
# token is needed.
#
# The VS Code extension (editors/vscode) is built and attached to the
# release as a .vsix. It is also published to the VS Code Marketplace
# and Open VSX when the repository has VSCE_PAT / OVSX_PAT secrets.

on:
  release:
    types: [published]
  # Re-publish only the VS Code extension for a release that already exists
  # (e.g. after adding VSCE_PAT / OVSX_PAT); PyPI is not touched.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose extension to publish, e.g. v0.6.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - run: pip install build && python -m build
      # A CycloneDX bill of materials for the release (the files' hashes and the optional extras).
      - run: |
          pip install -e .
          python -m pyweb.sbom --release dist --out "pyweb-stack-${GITHUB_REF_NAME#v}.cdx.json"
      # Signed build provenance: anyone can check the files came from this workflow
      # (gh attestation verify <file> --repo MaanavKrishna/PyWeb).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # PEP 740 attestations: PyPI shows that each file was built by this workflow from this repository.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
      - name: Attach files and changelog notes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* pyweb-stack-*.cdx.json --clobber
          if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  vscode:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extension version matches the release
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${TAG}" || { echo "editors/vscode version $v != ${TAG}"; exit 1; }
      - run: npm ci && npm test && npx vsce package
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: editors/vscode/*.vsix
      - name: Attach the .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" *.vsix --clobber
      - name: Publish to the VS Code Marketplace (if VSCE_PAT is set)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: if [ -n "$VSCE_PAT" ]; then npx vsce publish --packagePath *.vsix; else echo "no VSCE_PAT; skipped"; fi
      - name: Publish to Open VSX (if OVSX_PAT is set)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish *.vsix -p "$OVSX_PAT"; else echo "no OVSX_PAT; skipped"; fi
