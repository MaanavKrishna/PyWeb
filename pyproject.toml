[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyweb"
version = "0.1.0"
description = "PyWeb — Python from browser to database"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pyweb = "pyweb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
